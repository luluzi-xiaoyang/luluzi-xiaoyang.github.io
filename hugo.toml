baseURL = 'https://luluzi-xiaoyang.github.io/'
languageCode = 'zh-cn'
title = '💕 我们的小天地'

theme = 'PaperMod'

# ############################# SEO #############################
enableRobotsTXT = true
canonifyURLs = true

[permalinks]
  posts = '/:year/:month/:slug/'

[params]
  [params.assets]
    favicon = 'favicon.svg'
  description = '记录我们的甜蜜日常 — 属于我们的小小世界'
  author = '小透明 & 小可爱'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # SEO
  keywords = ['情侣', '恋爱', '日常', '甜蜜', '记录']
  images = ['/favicon.svg']

  # 中文字体支持
  assets.cssExtended = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

  [params.homeInfoParams]
    Title = '💕 欢迎来到我们的小天地'
    Content = '''
      这里是属于我们的甜蜜空间——
      记录每一个温暖的小瞬间 💝

      **🍰 一起吃好吃的**｜**🌹 一起看风景**｜**📸 一起拍美美的照片**

      > 最好的时光，是和你在一起的每一刻。
    '''

  # [params.socialIcons]
  #   github = "https://github.com/luluzi-xiaoyang"

  # 归档格式
  [params.archive]
    dateFormat = "2006-01-02"
    groupByYear = true
    enableEmoji = true

[menu]
[[menu.main]]
  identifier = 'food'
  name = '🍰 美食时光'
  url = '/food/'
  weight = 1
[[menu.main]]
  identifier = 'travel'
  name = '🌹 旅行足迹'
  url = '/travel/'
  weight = 2
[[menu.main]]
  identifier = 'vlog'
  name = '📸 甜蜜日常'
  url = '/vlog/'
  weight = 3
[[menu.main]]
  identifier = 'about'
  name = '💕 关于我们'
  url = '/about/'
  weight = 4

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'

[outputFormats]
  [outputFormats.RSS]
    mediatype = 'application/rss+xml'
    baseName = 'index'
