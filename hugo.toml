baseURL = 'https://myblog.example.com/'
languageCode = 'zh-cn'
title = '我的生活记录'

theme = 'PaperMod'

# ############################# SEO #############################
enableRobotsTXT = true
canonifyURLs = true

[permalinks]
  posts = '/:year/:month/:slug/'

[params]
  [params.assets]
    favicon = 'favicon.svg'
  description = '记录美食、旅行与生活的点点滴滴 — 一个热爱生活的个人博客'
  author = '生活家'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # SEO
  keywords = ['美食', '旅行', 'Vlog', '生活记录', '博客']
  images = ['/favicon.svg']

  # 中文字体支持
  assets.cssExtended = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

  [params.homeInfoParams]
    Title = '你好，欢迎来我的小窝 🏠'
    Content = '''
      这里记录着我平凡生活里的闪光瞬间——
      **🍜 美食探店**｜**✈️ 旅行打卡**｜**📹 日常Vlog**

      > 生活不是为了赶路，而是为了感受路。
    '''

  # [params.socialIcons]
  #   github = "https://github.com/yourusername"

  # 归档格式
  [params.archive]
    dateFormat = "2006-01-02"
    groupByYear = true
    enableEmoji = true

[menu]
[[menu.main]]
  identifier = 'food'
  name = '🍜 美食分享'
  url = '/food/'
  weight = 1
[[menu.main]]
  identifier = 'travel'
  name = '✈️ 旅行打卡'
  url = '/travel/'
  weight = 2
[[menu.main]]
  identifier = 'vlog'
  name = '📹 日常Vlog'
  url = '/vlog/'
  weight = 3
[[menu.main]]
  identifier = 'about'
  name = '👤 关于我'
  url = '/about/'
  weight = 4

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'

[outputFormats]
  [outputFormats.RSS]
    mediatype = 'application/rss+xml'
    baseName = 'index'
